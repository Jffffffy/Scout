# One-click deploy on Render: New + > Blueprint > pick this repo.
services:
  - type: web
    name: scout
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/status
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: OPENROUTER_KEY
        sync: false        # paste it in the Render dashboard, never in git
      - key: VISION_MODEL
        value: google/gemini-2.5-flash
      - key: ASK_MODEL
        value: google/gemini-2.5-flash
      - key: DEMO_MODE
        value: "true"
